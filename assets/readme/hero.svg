<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">pi-web-complete</title>
  <desc id="desc">Four web tools route agent requests through search, local reading, shared browser control, and current documentation.</desc>
  <rect width="1200" height="420" rx="24" fill="#081018"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#243342" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="66" fill="#7f93a8" font-size="18" letter-spacing="3">PI EXTENSION / WEB ACCESS</text>
    <text x="64" y="137" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="700">pi-web-complete</text>
    <text x="64" y="189" fill="#b9c6d3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27">Search. Read. Co-drive. Stay current.</text>

    <path d="M64 241H582" stroke="#243342" stroke-width="2"/>
    <circle cx="72" cy="282" r="6" fill="#59d9e8"/>
    <text x="92" y="290" fill="#dce5ed" font-size="20">5 supported search backends</text>
    <circle cx="72" cy="326" r="6" fill="#68e0a1"/>
    <text x="92" y="334" fill="#dce5ed" font-size="20">local extraction + ranked excerpts</text>
    <circle cx="72" cy="370" r="6" fill="#f3c96b"/>
    <text x="92" y="378" fill="#dce5ed" font-size="20">visible browser, optional Herdr pane</text>
  </g>

  <g transform="translate(650 48)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="486" height="324" rx="18" fill="#0d1823" stroke="#304456" stroke-width="2"/>
    <circle cx="28" cy="27" r="5" fill="#59d9e8"/>
    <text x="46" y="34" fill="#8fa3b7" font-size="17">agent request</text>
    <path d="M28 48V277" stroke="#304456" stroke-width="2"/>

    <g transform="translate(54 64)">
      <rect width="176" height="52" rx="9" fill="#122533" stroke="#59d9e8"/>
      <text x="18" y="33" fill="#e9f4f8" font-size="19">web_search</text>
      <text x="197" y="32" fill="#8fa3b7" font-size="17">discover</text>
    </g>
    <g transform="translate(54 126)">
      <rect width="176" height="52" rx="9" fill="#12271f" stroke="#68e0a1"/>
      <text x="18" y="33" fill="#edf8f1" font-size="19">web_read</text>
      <text x="197" y="32" fill="#8fa3b7" font-size="17">extract</text>
    </g>
    <g transform="translate(54 188)">
      <rect width="176" height="52" rx="9" fill="#2a2416" stroke="#f3c96b"/>
      <text x="18" y="33" fill="#fff7e1" font-size="19">web_cowork</text>
      <text x="197" y="32" fill="#8fa3b7" font-size="17">interact</text>
    </g>
    <g transform="translate(54 250)">
      <rect width="176" height="52" rx="9" fill="#201e32" stroke="#a9a0ff"/>
      <text x="18" y="33" fill="#f1efff" font-size="19">context7</text>
      <text x="197" y="32" fill="#8fa3b7" font-size="17">verify docs</text>
    </g>
  </g>
</svg>
